# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo in Render Dashboard to auto-detect this file.

services:
  - type: web
    name: ewards-learning-hub-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    repo: https://github.com/somdebmyewards-ship-it/ewards-course-module.git
    branch: main
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: "eWards Learning Hub"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: ewards-learning-hub-api
          property: host
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: gateway01.us-east-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: ewards_lms
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      - key: MYSQL_ATTR_SSL_VERIFY
        value: "true"
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_LIFETIME
        value: "120"
      - key: FILESYSTEM_DISK
        value: public
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SANCTUM_TOKEN_EXPIRATION
        value: "480"
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "eWards Learning Hub"
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: llama3-8b-8192
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
